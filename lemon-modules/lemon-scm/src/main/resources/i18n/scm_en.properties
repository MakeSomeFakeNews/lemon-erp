scm.ai.tool.salesOrders=Sales orders
scm.ai.tool.salesOrders.desc=List sales orders, newest first: orderNo, orderDate, partnerName customer, salesman, status (DRAFT draft, APPROVING under approval, APPROVED approved, PARTIAL partially received/delivered, COMPLETED completed, CLOSED closed), totalQty ordered quantity, doneQty delivered quantity (net of returns), amount total including tax (in the order currency), deliveryDate. Filter by order number, customer, material, status and order date (no date limit when omitted). Use to find specific orders or the orders of a customer; for amounts and rankings use scm_sales_summary, for undelivered lines use scm_backorders.
scm.ai.tool.salesSummary=Sales summary
scm.ai.tool.salesSummary.desc=Amounts of approved sales orders (including in progress, completed and closed; excluding drafts and orders under approval), grouped by customer, salesperson, material or month and ranked by amount (by month in chronological order): rank, code / name, month, orderCount, qty (when grouped by material), amount total including tax in the base currency (CNY), sharePercent share of the total; the last row is the total. Dates are order dates, defaulting to the first day of this month through today, at most one year. Use for questions like sales this month, top 10 customers this year, salesperson ranking, sales of a material, monthly sales trend.
scm.ai.tool.purchaseOrders=Purchase orders
scm.ai.tool.purchaseOrders.desc=List purchase orders, newest first: orderNo, orderDate, partnerName supplier, status (DRAFT draft, APPROVING under approval, APPROVED approved, PARTIAL partially received/delivered, COMPLETED completed, CLOSED closed), totalQty ordered quantity, doneQty received quantity (net of returns), amount total including tax (in the order currency), deliveryDate. Filter by order number, supplier, material, status and order date (no date limit when omitted). Use to find specific purchase orders; for amounts and supplier rankings use scm_purchase_summary, for lines not yet received use scm_backorders.
scm.ai.tool.purchaseSummary=Purchase summary
scm.ai.tool.purchaseSummary.desc=Amounts of approved purchase orders (including in progress, completed and closed), grouped by supplier, material or month and ranked by amount (by month in chronological order): rank, code / name, month, orderCount, qty (when grouped by material), amount total including tax in the base currency (CNY), sharePercent share of the total; the last row is the total. Dates are order dates, defaulting to the first day of this month through today, at most one year. Use for questions like purchases this month, the largest suppliers, how much of a material was purchased.
scm.ai.tool.backorders=Backorders
scm.ai.tool.backorders.desc=Open lines of approved or partially completed orders, ordered by delivery date: kind=SALES lists goods not yet delivered to customers, kind=PURCHASE lists goods not yet received from suppliers. openQty open quantity, doneQty delivered or received quantity, deliveryDate, overdueDays days past the delivery date (empty if not overdue), availableQty current available stock (sales only). Use for questions like which orders have not shipped, which purchases are overdue, what is still owed to a customer.
scm.ai.tool.salesOutDocs=Sales deliveries and returns
scm.ai.tool.salesOutDocs.desc=Sales delivery documents (type=SALES_OUT, default) or sales return documents (type=SALES_RETURN), newest first: docNo, bizDate, partnerName customer, orderNo, warehouse, totalQty, amount total including tax in the base currency (CNY); the last row totals all matching documents. Dates default to the first day of this month through today, at most one year. Use for questions like how much was shipped this month or the returns of a customer.
scm.ai.tool.purchaseInDocs=Purchase receipts and returns
scm.ai.tool.purchaseInDocs.desc=Purchase receipt documents (type=PURCHASE_IN, default) or purchase return documents (type=PURCHASE_RETURN), newest first: docNo, bizDate, partnerName supplier, orderNo, warehouse, totalQty, amount total including tax in the base currency (CNY); the last row totals all matching documents. Dates default to the first day of this month through today, at most one year. Use for questions like how much was received this month or what was returned to a supplier.
scm.ai.tool.priceHistory=Purchase price history
scm.ai.tool.priceHistory.desc=Purchase price history of one material (prices of purchase receipts, newest first, at most 100): bizDate receipt date, docNo receipt number, supplierName, qty, price unit price including tax (CNY), taxRate tax rate (%). Optionally for one supplier. Use for questions like the latest purchase price of a material, whether the price went up, which supplier is cheaper.
scm.ai.tool.supplierPerformance=Supplier performance
scm.ai.tool.supplierPerformance.desc=Supplier performance over a period (default the last year), optionally ranked by a metric: level supplier level, orderCount purchase orders, purchaseAmount receipt amount (CNY, net of returns), onTimeRate on-time delivery rate (%), iqcBatches incoming inspection batches, iqcPassRate incoming pass rate (%, concessions count as passed), returnRate return rate (%), claimCount / claimAmount quality claims, lastScore / lastGrade latest evaluation score and grade (A to D). Use for questions like supplier ranking, the most punctual supplier, the supplier with the lowest incoming pass rate.
