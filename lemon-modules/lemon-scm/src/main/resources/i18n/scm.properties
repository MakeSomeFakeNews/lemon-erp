scm.ai.tool.salesOrders=销售订单查询
scm.ai.tool.salesOrders.desc=查询销售订单清单，最新的在前：orderNo 订单号、orderDate 订单日期、partnerName 客户、salesman 业务员、status 状态（DRAFT 草稿、APPROVING 审批中、APPROVED 已审核、PARTIAL 部分出入库、COMPLETED 已完成、CLOSED 已关闭）、totalQty 订购数量、doneQty 已出库数量（扣除退货）、amount 价税合计（订单币种 currency）、deliveryDate 交货日期。可按订单号、客户、物料、状态、订单日期筛选，日期不填为不限。用于查找具体订单、某客户的订单；统计金额或排行请用 scm_sales_summary，未发货明细请用 scm_backorders。
scm.ai.tool.salesSummary=销售汇总
scm.ai.tool.salesSummary.desc=统计已审核的销售订单（含执行中、已完成、已关闭，不含草稿和审批中）的金额，按客户、业务员、物料或月份汇总，按金额从高到低排名（按月时按月份先后）：rank 名次、code / name 编码和名称、month 月份、orderCount 订单数、qty 数量（按物料汇总时）、amount 本位币价税合计（元）、sharePercent 占合计的百分比；最后一行为合计。日期按订单日期，默认本月 1 日至今天，跨度不超过一年。用于「本月销售额」「今年前 10 大客户」「业务员业绩排行」「某物料卖了多少」「各月销售趋势」等问题。
scm.ai.tool.purchaseOrders=采购订单查询
scm.ai.tool.purchaseOrders.desc=查询采购订单清单，最新的在前：orderNo 订单号、orderDate 订单日期、partnerName 供应商、status 状态（DRAFT 草稿、APPROVING 审批中、APPROVED 已审核、PARTIAL 部分出入库、COMPLETED 已完成、CLOSED 已关闭）、totalQty 订购数量、doneQty 已入库数量（扣除退货）、amount 价税合计（订单币种 currency）、deliveryDate 交货日期。可按订单号、供应商、物料、状态、订单日期筛选，日期不填为不限。用于查找具体采购订单；统计金额或供应商排行请用 scm_purchase_summary，未到货明细请用 scm_backorders。
scm.ai.tool.purchaseSummary=采购汇总
scm.ai.tool.purchaseSummary.desc=统计已审核的采购订单（含执行中、已完成、已关闭）的金额，按供应商、物料或月份汇总，按金额从高到低排名（按月时按月份先后）：rank 名次、code / name 编码和名称、month 月份、orderCount 订单数、qty 数量（按物料汇总时）、amount 本位币价税合计（元）、sharePercent 占比（%）；最后一行为合计。日期按订单日期，默认本月 1 日至今天，跨度不超过一年。用于「本月采购额」「采购金额最大的供应商」「某物料采购了多少」等问题。
scm.ai.tool.backorders=欠交明细
scm.ai.tool.backorders.desc=查询已审核、部分完成的订单中尚未交完的明细，按交货日期排列：kind=SALES 为客户欠交（未发货），kind=PURCHASE 为供应商欠交（未到货）。openQty 未交数量、doneQty 已交数量、deliveryDate 交货日期、overdueDays 已逾期天数（未逾期为空）、availableQty 当前可用库存（仅销售）。用于「还有哪些订单没发货」「哪些采购逾期未到货」「某客户还欠多少货」等问题。
scm.ai.tool.salesOutDocs=销售出库与退货
scm.ai.tool.salesOutDocs.desc=查询销售出库单（type=SALES_OUT，默认）或销售退货单（type=SALES_RETURN），最新的在前：docNo 单号、bizDate 日期、partnerName 客户、orderNo 订单号、warehouse 仓库、totalQty 数量、amount 本位币价税合计（元）；最后一行为全部符合条件单据的合计。日期默认本月 1 日至今天，跨度不超过一年。用于「本月发了多少货」「某客户的退货」等问题。
scm.ai.tool.purchaseInDocs=采购入库与退货
scm.ai.tool.purchaseInDocs.desc=查询采购入库单（type=PURCHASE_IN，默认）或采购退货单（type=PURCHASE_RETURN），最新的在前：docNo 单号、bizDate 日期、partnerName 供应商、orderNo 订单号、warehouse 仓库、totalQty 数量、amount 本位币价税合计（元）；最后一行为全部符合条件单据的合计。日期默认本月 1 日至今天，跨度不超过一年。用于「本月到了多少货」「向某供应商退了哪些货」等问题。
scm.ai.tool.priceHistory=采购价格历史
scm.ai.tool.priceHistory.desc=查询某物料的采购价格历史（采购入库的成交价，最近的在前，最多 100 条）：bizDate 入库日期、docNo 入库单号、supplierName 供应商、qty 数量、price 含税单价（元）、taxRate 税率（%）。可指定供应商。用于「某物料最近的采购价」「价格涨了没有」「哪家供应商更便宜」等问题。
scm.ai.tool.supplierPerformance=供应商绩效
scm.ai.tool.supplierPerformance.desc=统计供应商绩效，期间默认最近一年，可按指标排行：level 供应商等级、orderCount 采购订单数、purchaseAmount 采购入库金额（元，扣除退货）、onTimeRate 准时交货率（%）、iqcBatches 来料检验批次、iqcPassRate 来料合格率（%，让步接收计为合格）、returnRate 退货率（%）、claimCount / claimAmount 质量索赔次数与金额、lastScore / lastGrade 最近一次评估的得分与等级（A 至 D）。用于「供应商排行」「哪家供应商交货最准时」「来料合格率最低的供应商」等问题。
