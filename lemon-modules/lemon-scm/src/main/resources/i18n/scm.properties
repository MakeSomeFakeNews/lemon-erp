scm.label.tradeDraft=进销存单据先存草稿
scm.label.tradeDraftRemark=开启后采购入库、采购退货、销售出库、销售退货（含直接开单）可以先保存为草稿，草稿可修改、删除，不影响库存、订单、应收应付和凭证；审核（记账）后才出入库、生成应收应付，审核后不能修改，错误的单据通过退货冲回。直接保存并审核需要审核权限。关闭时保存即审核（与原来一致）
