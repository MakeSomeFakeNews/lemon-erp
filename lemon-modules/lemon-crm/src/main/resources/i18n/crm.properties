# AI 问数工具（名称显示给用户；.desc 与参数说明是给模型看的提示词）
crm.ai.tool.salesFunnel=销售漏斗
crm.ai.tool.salesFunnel.desc=查询客户经营概览与销售漏斗（全公司）：overview 为客户数、本月新增客户与线索、进行中商机数与金额（加权金额按赢率）、本月赢单、历史赢率、未解决与超时工单；stages 为各阶段（INITIAL 初步接洽、NEEDS 需求确认、PROPOSAL 方案报价、NEGOTIATION 商务谈判、WON 赢单、LOST 输单）的商机数、金额、到达数和到下一阶段的转化率；owners 为各销售人员的客户数、进行中商机、本年赢单和本月跟进次数。金额单位元。用于回答商机漏斗、转化率、销售业绩、跟进情况等问题。
crm.ai.tool.tickets=服务工单
crm.ai.tool.tickets.desc=查询售后服务工单。view=LIST（默认）按条件列出工单：单号、标题、类型、优先级、状态（OPEN 待处理、PROCESSING 处理中、RESOLVED 已解决、CLOSED 已关闭）、客户、处理人、创建与截止时间、是否超时，overdueOnly=true 只看超时未解决的；view=BY_TYPE 按类型统计工单数、未解决数、平均解决时长（分钟）、按时解决数、已解决数、满意度。
crm.ai.tool.contracts=销售合同与回款
crm.ai.tool.contracts.desc=查询销售合同与回款计划。view=CONTRACTS（默认）列出合同（默认执行中）的金额、已回款、未回款（元）及负责人；view=OVERDUE_PLANS 列出执行中合同里已逾期的回款计划（计划日期、逾期天数、计划金额、已回款、未回款）。用于回答合同回款进度、哪些回款逾期等问题。
crm.ai.param.top=最多返回的行数，默认 50
crm.ai.param.ticketView=查询方式：LIST 列出工单（默认），BY_TYPE 按类型统计
crm.ai.param.ticketStatus=工单状态，不传为全部
crm.ai.param.overdueOnly=是否只看超时未解决的工单
crm.ai.param.ticketType=工单类型编码
crm.ai.param.ticketKeyword=工单号、标题或客户名称包含的关键字
crm.ai.param.contractView=查询方式：CONTRACTS 合同列表（默认），OVERDUE_PLANS 逾期回款计划
crm.ai.param.contractStatus=合同状态，默认 ACTIVE 执行中（只对合同列表有效）
crm.ai.param.contractKeyword=合同号、合同名称或客户名称包含的关键字
