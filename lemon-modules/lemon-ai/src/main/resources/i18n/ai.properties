型号、尺寸、材质、颜色、等级等关键参数不同的不算重复，不确定时判为不重复。\n\
如果重复，从组内选出建议保留的一条（信息更完整、写法更规范、编码更早的优先）作为 keepId，其余重复的记录放入 duplicateIds；只有部分记录重复时只列出这些记录。\n\
每组都要输出一项，group 为输入中的组号；reason 用{1}简要说明理由；confidence 为 0～100 的整数，表示有多确定。
