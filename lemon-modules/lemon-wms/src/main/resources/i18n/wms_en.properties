# AI query tools
wms.ai.param.startDate=Start date, format yyyy-MM-dd
wms.ai.param.endDate=End date, format yyyy-MM-dd, defaults to today
wms.ai.param.limit=Maximum number of rows to return, default 50, at most 200
wms.ai.param.materialKeyword=Material code or name (fuzzy match)
wms.ai.param.warehouse=Warehouse name or code; omit for all warehouses
wms.ai.param.category=Material category code: RAW raw material, SEMI semi-finished, FINISHED finished goods, PACKING packaging, LOW_VALUE low-value consumables, OTHER other (as defined in the company dictionary)
wms.ai.param.lowStockOnly=Only materials whose stock is below the safety stock
wms.ai.param.stockDetail=List details by warehouse, location and batch; default false summarizes by material
wms.ai.param.expiryDays=Batches expiring within this many days from today, default 30
wms.ai.param.includeExpired=Include batches that have already expired, default true
wms.ai.param.minAgeDays=Only batches at least this many days old, default 0
wms.ai.param.flowBizType=Business type: IN inbound, OUT outbound, TRANSFER transfer, CHECK stock count
wms.ai.param.batchNo=Batch number (exact match)
wms.ai.param.docNo=Document number (exact match)
wms.ai.tool.stock=Stock inquiry
wms.ai.tool.stock.desc=Current stock of materials. By default summarized by material over all (or the given) warehouses: qty on-hand quantity, frozenQty frozen quantity (pending inspection or rejected, cannot be issued), availableQty available quantity, safetyStock safety stock, belowSafety whether below the safety stock. detail=true lists rows by warehouse, location and batch (with expiryDate); lowStockOnly=true lists only materials below the safety stock (need replenishment); highStockOnly=true lists only materials above the maximum stock (overstock). safetyStock is the minimum, maxStock the maximum stock, alertMode TOTAL compares the total of all warehouses and WAREHOUSE checks each warehouse (limits are then the sum over warehouses), aboveMax whether above the maximum stock. Quantities are in the base unit (unit). Use for questions like how much stock of a material is left, which materials are short, what is in the finished goods warehouse.
wms.ai.tool.expiringBatches=Expiring batches
wms.ai.tool.expiringBatches.desc=Batches in stock that expire within the given number of days (default 30, expired ones included), nearest expiry first: daysLeft is the number of days until expiry (negative means expired); qty is the quantity in stock across all warehouses. Only batch-managed materials with an expiry date are included. Use for questions like which batches are about to expire or whether there is expired stock.
wms.ai.tool.stockAge=Stock aging
wms.ai.tool.stockAge.desc=Age of stock in hand by batch, oldest first: inDate is the date the batch was first received, ageDays the number of days since then, ageBucket the age range (0-30, 31-90, 91-180, 181-365, 365+ days), qty the quantity in stock across all warehouses. Only batch-managed materials are included. Use for slow-moving stock questions such as which stock has been held longest or materials older than 180 days.
wms.ai.tool.inOutSummary=Stock movement summary
wms.ai.tool.inOutSummary.desc=Opening, receipts, issues and closing quantities per material within a date range (base unit): openQty opening, purchaseIn purchase receipts, productionIn production receipts, salesReturn sales returns, otherIn other receipts, salesOut sales deliveries, productionOut production issues (net of returns), purchaseReturn purchase returns, otherOut other issues, closeQty closing. Dates default to the first day of this month through today, at most one year. Use for questions like how much of a material came in and went out this month.
wms.ai.tool.stockFlow=Stock transactions
wms.ai.tool.stockFlow.desc=Stock transaction lines (each receipt, issue, transfer and count), newest first: bizType business type (IN inbound, OUT outbound, TRANSFER transfer, CHECK stock count), positive qty increases stock and negative qty decreases it, docNo document number, operator the user. Dates default to the last 30 days. Use for questions like recent movements of a material, where a batch went, or which stock a document affected.
