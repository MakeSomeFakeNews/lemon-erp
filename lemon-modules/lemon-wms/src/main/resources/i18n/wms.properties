# AI 问数工具
wms.ai.param.startDate=开始日期，格式 yyyy-MM-dd
wms.ai.param.endDate=结束日期，格式 yyyy-MM-dd，默认今天
wms.ai.param.limit=最多返回的行数，默认 50，最大 200
wms.ai.param.materialKeyword=物料编码或名称（模糊匹配）
wms.ai.param.warehouse=仓库名称或编码，不填为全部仓库
wms.ai.param.category=物料分类编码：RAW 原材料、SEMI 半成品、FINISHED 成品、PACKING 包装材料、LOW_VALUE 低值易耗品、OTHER 其他（以本公司字典为准）
wms.ai.param.lowStockOnly=只看库存低于安全库存的物料
wms.ai.param.stockDetail=是否按仓库、库位、批次列出明细，默认 false 按物料汇总
wms.ai.param.expiryDays=有效期在今天起多少天内，默认 30
wms.ai.param.includeExpired=是否包含已过期的批次，默认 true
wms.ai.param.minAgeDays=只看库龄不少于多少天的批次，默认 0
wms.ai.param.flowBizType=业务类型：IN 入库、OUT 出库、TRANSFER 调拨、CHECK 盘点
wms.ai.param.batchNo=批次号（精确匹配）
wms.ai.param.docNo=单据号（精确匹配）
wms.ai.tool.stock=库存查询
wms.ai.tool.stock.desc=查询物料的当前库存。默认按物料汇总全部（或指定）仓库：qty 库存数量、frozenQty 冻结数量（待检、不合格，不能出库）、availableQty 可用数量、safetyStock 安全库存、belowSafety 是否低于安全库存；detail=true 时按仓库、库位、批次列出明细（含有效期 expiryDate）；lowStockOnly=true 只列出低于安全库存（需要补货）的物料。数量按物料的基本单位 unit。用于「某物料还有多少库存」「哪些物料库存不足」「成品仓有哪些货」等问题。
wms.ai.tool.expiringBatches=临期批次
wms.ai.tool.expiringBatches.desc=查询有库存且在指定天数内到期（默认 30 天，含已过期）的批次，按有效期从近到远排列：daysLeft 为距有效期的天数，负数表示已过期；qty 为全部仓库的在库数量。只包含启用批次管理并填写了有效期的物料。用于「哪些批次快过期了」「有没有过期库存」等问题。
wms.ai.tool.stockAge=库龄分析
wms.ai.tool.stockAge.desc=按批次分析在库库存的库龄，库龄最长的在前：inDate 为批次首次入库日期，ageDays 为至今的天数，ageBucket 为库龄区间（0-30、31-90、91-180、181-365、365+ 天），qty 为全部仓库的在库数量。只统计启用批次管理的物料。用于「哪些库存放得最久」「库龄超过 180 天的物料」等呆滞库存问题。
wms.ai.tool.inOutSummary=收发存汇总
wms.ai.tool.inOutSummary.desc=按物料统计日期范围内的收发存（数量，基本单位）：openQty 期初、purchaseIn 采购入库、productionIn 生产入库、salesReturn 销售退货、otherIn 其他入库、salesOut 销售出库、productionOut 生产领料（扣除退料）、purchaseReturn 采购退货、otherOut 其他出库、closeQty 期末。日期默认本月 1 日至今天，跨度不超过一年。用于「本月某物料进出了多少」「上月领料最多的物料」等问题。
wms.ai.tool.stockFlow=出入库流水
wms.ai.tool.stockFlow.desc=查询库存流水（每次出入库、调拨、盘点的明细），最新的在前：bizType 业务类型（IN 入库、OUT 出库、TRANSFER 调拨、CHECK 盘点），qty 为正表示库存增加、为负表示减少，docNo 为单据号，operator 为操作人。日期默认最近 30 天。用于「某物料最近的出入库记录」「某批次的去向」「某单据影响了哪些库存」等问题。
