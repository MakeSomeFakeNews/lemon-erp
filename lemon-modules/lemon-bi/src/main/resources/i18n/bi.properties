# AI 问数工具（名称显示给用户；.desc 与参数说明是给模型看的提示词）
bi.ai.tool.cockpit=经营驾驶舱
bi.ai.tool.cockpit.desc=查询全公司经营关键指标：kpi 含本月销售额及环比 / 同比（%）、本月毛利与毛利率（%）、本年销售额及同比、本年毛利率、本月采购额、应收余额与逾期、应付余额、未完成销售订单金额、在制与延期工单数、进行中项目数与平均进度、在职人数、商机金额、未解决与超时工单；trend 为近 6 个月的销售额、毛利、采购额、收入、费用、利润；topCustomers 为本年销售额前 5 的客户；triggeredAlerts 为当前触发的经营预警。金额单位元。用于回答公司整体经营状况、本月业绩、有哪些预警等问题。
bi.ai.tool.abc=ABC 分析
bi.ai.tool.abc.desc=查询物料 ABC 分类（近一年销售成本累计占比 70% 以内为 A 类、90% 以内为 B 类、其余 C 类；没有成本时按销售额）：summary 为各类物料数、金额与占比，rows 为按金额降序的物料（可按 abcClass 筛选）。用于回答哪些是重点物料、A 类物料有哪些等问题。
bi.ai.tool.slowMoving=呆滞物料
bi.ai.tool.slowMoving.desc=查询呆滞物料：有库存但超过指定天数（默认 90 天）没有出库的物料，返回库存数量、库存金额（元）、最近出库时间、闲置天数，按库存金额降序。用于回答呆滞库存、哪些物料长期不动等问题。
bi.ai.tool.forecast=销售预测
bi.ai.tool.forecast.desc=预测未来几个月的销售额（元）：用近 12 个月的线性趋势，满两年数据时乘以季节指数；返回预测方法、是否考虑季节、每月趋势增量、最近 12 个月的实际销售额和从本月开始的预测值（period 为 yyyyMM）。预测仅供参考，回答时说明方法。
bi.ai.param.top=最多返回的行数，默认 20
bi.ai.param.abcClass=只返回某一类物料：A、B 或 C
bi.ai.param.slowDays=超过多少天没有出库视为呆滞，默认 90
bi.ai.param.forecastMonths=预测的月数（1-12），默认 3
bi.ai.param.category=物料分类编码（如 RAW 原材料、SEMI 半成品、FINISHED 产成品），不传为全部

