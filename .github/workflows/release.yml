# 发布新版本：在 GitHub 上发布 Release（标签 vX.Y.Z）后自动执行
#   1. 构建后端、前端镜像（linux/amd64、linux/arm64）推送到 GitHub Packages（ghcr.io）
#   2. 构建后端 jar、前端静态文件，连同初始化脚本、Docker 部署文件上传到 Release
name: 发布版本

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 已有的 Release 标签，例如 v1.0.0
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  images:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            dockerfile: docker/backend.Dockerfile
            title: 柠檬ERP 后端
          - name: web
            dockerfile: docker/web.Dockerfile
            title: 柠檬ERP 前端（Nginx）
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/lemon-erp-${{ matrix.name }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=${{ matrix.title }}
            org.opencontainers.image.description=真正 100% 开源、无功能限制的 ERP 系统
            org.opencontainers.image.licenses=Apache-2.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  assets:
    name: 上传发布文件
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: 构建后端 jar
        run: ./gradlew --no-daemon :lemon-admin:bootJar
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: lemon-web/package-lock.json
      - name: 构建前端
        working-directory: lemon-web
        run: npm ci && npm run build
      - name: 打包
        run: |
          VERSION="${TAG#v}"
          mkdir -p dist
          cp lemon-admin/build/libs/lemon-erp.jar "dist/lemon-erp-${VERSION}.jar"
          (cd lemon-web/dist && zip -qr "../../dist/lemon-web-${VERSION}.zip" .)
          cp sql/init.sql dist/init.sql
          # Docker 部署包：使用 ghcr.io 上的镜像，解压后进入 docker 目录执行 docker compose up -d
          mkdir -p "pkg/lemon-erp-docker-${VERSION}/docker" "pkg/lemon-erp-docker-${VERSION}/sql"
          cp sql/init.sql "pkg/lemon-erp-docker-${VERSION}/sql/"
          # 去掉 build 配置，直接拉取镜像
          sed -e '/^    build:/,/^    image:/{/^    image:/!d;}' -e 's#docker compose up -d --build#docker compose up -d#' \
              docker/docker-compose.yml > "pkg/lemon-erp-docker-${VERSION}/docker/docker-compose.yml"
          sed -e "s#^IMAGE_PREFIX=.*#IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lemon-erp#" \
              -e "s#^IMAGE_TAG=.*#IMAGE_TAG=${VERSION}#" \
              docker/.env.example > "pkg/lemon-erp-docker-${VERSION}/docker/.env.example"
          (cd pkg && zip -qr "../dist/lemon-erp-docker-${VERSION}.zip" .)
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -lh dist
      - name: 上传到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" dist/* --clobber
