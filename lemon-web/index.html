<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>柠檬ERP</title>
    <script>
      // 首屏前应用主题，避免暗色模式闪白
      try {
        var s = JSON.parse(localStorage.getItem('lemon_erp_settings') || '{}')
        var dark = s.dark != null ? s.dark : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <style>
      .app-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font: 14px system-ui, sans-serif;
        color: #8c8c8c;
        background: #f4f6fa;
      }
      html[data-theme='dark'] .app-loading {
        background: #0d0d0e;
      }
      .app-loading-dot {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 3px solid rgba(22, 119, 255, 0.2);
        border-top-color: #1677ff;
        animation: app-spin 0.8s linear infinite;
      }
      @keyframes app-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="app-loading">
        <div class="app-loading-dot"></div>
        <div>正在加载…</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
